; ESP32-S2 mini (LOLIN S2 Mini): generates the joint enable signal (SIG_FREQ_HZ) and drives the 24V / AUX relays.
; Pinned to espressif32@6.9.0 (Arduino core 2.0.x) - the LEDC / task WDT calls in main.cpp use the IDF 4.4 API.

[env:lolin_s2_mini]
platform = espressif32@6.9.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
